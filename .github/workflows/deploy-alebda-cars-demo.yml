name: Deploy Alebda Cars Demo

on:
  push:
    branches: [main]
    paths:
      - 'public-demos/alebda-cars-2026-demo/**'
      - '.github/workflows/deploy-alebda-cars-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-demos/alebda-cars-2026-demo
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
